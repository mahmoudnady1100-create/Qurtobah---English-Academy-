<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقات المفردات | قسم اللغة الإنجليزية | مدارس قرطبة المتقدمة</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
:root{--page:#5b21b6;--ink:#fff;--ink2:#ddd6fe;--line:rgba(255,255,255,.28);--teal:#5eead4;--red:#fca5a5;--deep:#4c1d95}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 14px 48px}
header{text-align:center;margin-bottom:16px}
header img{width:92px;height:auto;background:#fff;border-radius:14px;padding:8px;display:block;margin:0 auto 10px}
header h1{margin:0 0 4px;font-size:22px}
header p{margin:0;color:var(--ink2);font-size:14px}
.back{display:inline-block;margin-bottom:10px;color:var(--teal);text-decoration:none;font-size:14px;font-weight:600}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:#fff;color:var(--page)}
select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:#fff;font-size:15px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:13px;margin-bottom:8px}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .25s}
.scene{perspective:1000px;margin-bottom:12px}
.card{position:relative;height:290px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;outline:none}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.front{background:#fff;color:var(--page);direction:ltr}
.back-face{background:var(--deep);border:2px solid var(--teal);transform:rotateY(180deg)}
.word{font-size:34px;font-weight:700;line-height:1.25;margin:6px 0;overflow-wrap:anywhere}
.pos{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:#ede9fe;color:var(--page)}
.hint{position:absolute;bottom:12px;font-size:12px;opacity:.6}
.ar{font-size:30px;font-weight:700;color:var(--teal);margin:0 0 12px;line-height:1.4}
.ex{font-size:18px;direction:ltr;color:#fff;margin:0;line-height:1.5}
.spk{border:none;background:#ede9fe;color:var(--page);border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer;margin-top:10px}
.back-face .spk{background:rgba(255,255,255,.15);color:#fff;width:40px;height:40px;font-size:18px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row button{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.row .know{background:var(--teal);color:#064e3b;border-color:var(--teal)}
.row .again{background:var(--red);color:#7f1d1d;border-color:var(--red)}
.row button.sel{background:#fff;color:var(--page)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tools button{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:13px;cursor:pointer}
.tools button.on{background:#fff;color:var(--page)}
.note{color:var(--ink2);font-size:12px;text-align:center;margin-top:18px}
.empty{padding:40px 10px;text-align:center;color:var(--ink2)}
@media (max-width:420px){.word{font-size:29px}.ar{font-size:26px}.card{height:270px}}
</style>
</head>

var gi=0,ui=0,idx=0,order=[],reviewOnly=false,shuffled=false;
var $=function(i){return document.getElementById(i)};
function key(c){return 'fc:'+DATA[gi].units[ui].id+':'+c[0]}
function st(c){try{return localStorage.getItem(key(c))||''}catch(e){return ''}}
function setSt(c,v){try{localStorage.setItem(key(c),v)}catch(e){}}
function cards(){return DATA[gi].units[ui].cards}
function buildOrder(){
  var n=cards().length,o=[],i;for(i=0;i<n;i++)o.push(i);
  if(shuffled){for(i=n-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=o[i];o[i]=o[j];o[j]=t}}
  if(reviewOnly)o=o.filter(function(k){return st(cards()[k])!=='know'});
  order=o;if(idx>=order.length)idx=0;
}
function stats(){var k=0,c=cards();c.forEach(function(x){if(st(x)==='know')k++});return k}
function render(){
  var c=cards(),card=$('card');
  var k=stats();
  $('stats').textContent='أعرفها: '+k+' من '+c.length;
  $('prog').style.width=(k/c.length*100)+'%';
  if(!order.length){$('pos').textContent='';card.style.visibility='hidden';$('fword').textContent='';return}
  card.style.visibility='visible';
  var x=c[order[idx]];
  card.classList.remove('flip');
  $('fword').textContent=x[0];$('fpos').textContent={n:'noun',v:'verb',adj:'adjective',adv:'adverb',prep:'preposition',pron:'pronoun',exp:'expression'}[x[1]]||x[1];
  $('bar').textContent=x[2];$('bex').textContent=x[3];
  $('pos').textContent=(idx+1)+' / '+order.length;
  $('again').className='again'+(st(x)==='again'?' sel':'');
  $('know').className='know'+(st(x)==='know'?' sel':'');
  $('rev').className=reviewOnly?'on':'';$('shuf').className=shuffled?'on':'';
}
function cur(){return cards()[order[idx]]}
function go(d){if(!order.length)return;idx=(idx+d+order.length)%order.length;render()}
function speak(t){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;
  var v=speechSynthesis.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang)})[0]||speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)})[0];
  if(v)u.voice=v;speechSynthesis.speak(u);
}
function tabs(){
  $('tabs').innerHTML='';
  DATA.forEach(function(g,i){var b=document.createElement('button');b.textContent=g.name;b.className=i===gi?'on':'';b.onclick=function(){gi=i;ui=0;idx=0;tabs();units();buildOrder();render()};$('tabs').appendChild(b)});
}
function units(){
  var s=$('unit');s.innerHTML='';
  DATA[gi].units.forEach(function(u,i){var o=document.createElement('option');o.value=i;o.textContent=u.title+' ('+u.cards.length+')';s.appendChild(o)});
  s.value=ui;
}
$('unit').onchange=function(){ui=+this.value;idx=0;buildOrder();render()};
$('card').onclick=function(e){if(e.target.closest('.spk'))return;this.classList.toggle('flip')};
$('card').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();this.classList.toggle('flip')}};
$('spkw').onclick=function(e){e.stopPropagation();if(order.length)speak(cur()[0].replace(/\(.*?\)/g,'').replace(/\.\.\./g,''))};
$('spks').onclick=function(e){e.stopPropagation();if(order.length)speak(cur()[3])};
$('next').onclick=function(){go(1)};$('prev').onclick=function(){go(-1)};
$('know').onclick=function(){if(!order.length)return;setSt(cur(),'know');if(reviewOnly){buildOrder();render()}else go(1)};
$('again').onclick=function(){if(!order.length)return;setSt(cur(),'again');go(1)};
$('shuf').onclick=function(){shuffled=!shuffled;idx=0;buildOrder();render()};
$('rev').onclick=function(){reviewOnly=!reviewOnly;idx=0;buildOrder();render()};
$('reset').onclick=function(){if(!confirm('إعادة ضبط تقدمك في هذه الوحدة؟'))return;cards().forEach(function(c){try{localStorage.removeItem(key(c))}catch(e){}});idx=0;buildOrder();render()};
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)});
if('speechSynthesis' in window)speechSynthesis.getVoices();
tabs();units();buildOrder();render();
</script>
